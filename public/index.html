<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd">
<title>Aniq — adolatli birja auksioni</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbfd;--soft:#f5f5f7;--soft2:#efeff2;--card:#fff;--line:#e6e6eb;--line2:#d9d9df;--ink:#1d1d1f;--ink2:#424245;--mute:#6e6e73;--faint:#a1a1a6;
--em:#0b8a63;--em2:#12b886;--emsoft:#e7f6f0;--emline:#bfe6d6;--amber:#b25e09;--ambersoft:#fff4e5;--red:#d70015;--redsoft:#ffeceb;--blue:#0a66c2;--bluesoft:#eaf2fb;
--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);--shadow2:0 2px 6px rgba(0,0,0,.05),0 18px 48px rgba(0,0,0,.10);--r:20px;
--sans:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 50% -14%,rgba(18,184,134,.11),transparent 65%),radial-gradient(600px 400px at 100% 100%,rgba(10,102,194,.05),transparent 60%)}
/* animation */
@keyframes up{from{opacity:0;transform:translateY(18px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{opacity:.4}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes drop{0%{opacity:0;transform:translateY(-40px) rotate(-8deg) scale(.8)}70%{transform:translateY(4px) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}}
@keyframes wave{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes seal{0%{transform:translateY(0)}40%{transform:translateY(-10px) scale(1.04)}100%{transform:translateY(0)}}
@keyframes flap{from{transform:rotateX(180deg)}to{transform:rotateX(0)}}
@keyframes ticker{to{transform:translateX(-50%)}}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.in{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*80ms)}
/* layout */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px clamp(16px,4vw,40px);background:rgba(251,251,253,.78);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.045em}
.brand img{width:30px;height:30px}.brand em{font-style:normal;font-weight:500;color:var(--faint);margin-left:-5px}
.nav .sp{flex:1}
.navlink{font-size:14px;font-weight:600;color:var(--ink2);padding:8px 12px;border-radius:10px}
.navlink:hover,.navlink.on{background:var(--soft)}
.wallet{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.wallet .dot{width:8px;height:8px;border-radius:50%;background:var(--em2);box-shadow:0 0 0 3px var(--emsoft)}
main{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:16px;font-weight:700;font-size:16px;background:linear-gradient(90deg,#12b886,#0b8a63);color:#fff;box-shadow:0 0 0 1px var(--emline),0 12px 30px -12px rgba(11,138,99,.55);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.btn.dark{background:var(--ink);box-shadow:var(--shadow2)}
.btn.sm{height:40px;padding:0 16px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.g{background:var(--emsoft);color:var(--em)}.pill.a{background:var(--ambersoft);color:var(--amber)}.pill.r{background:var(--redsoft);color:var(--red)}.pill.b{background:var(--bluesoft);color:var(--blue)}
.pill .live{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.card{background:#fff;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line),var(--shadow);padding:22px}
.muted{color:var(--mute);font-size:14px}.tiny{font-size:12px;color:var(--faint)}
.mono{font-family:var(--mono);font-size:12px}
h1,h2,h3{margin:0;letter-spacing:-.035em}
.num{font-variant-numeric:tabular-nums}
/* hero */
.hero{text-align:center;padding:clamp(48px,9vw,96px) 0 30px}
.hero h1{font-size:clamp(44px,8.4vw,96px);font-weight:900;line-height:.98;letter-spacing:-.05em}
.hero h1 .gr{background:linear-gradient(90deg,#12b886,#0b8a63);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .strike{position:relative;color:var(--faint)}
.hero h1 .strike::after{content:"";position:absolute;left:-2%;right:-2%;top:54%;height:.09em;background:var(--red);border-radius:9px;transform-origin:left;animation:fill .6s .9s both;width:104%}
.hero p{font-size:clamp(17px,2.2vw,22px);color:var(--mute);max-width:640px;margin:22px auto 32px;line-height:1.45}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:56px 0 18px}
.st{position:relative;overflow:hidden;text-align:left}
.st .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--soft);margin-bottom:14px;animation:float 4s ease-in-out infinite;animation-delay:calc(var(--d)*500ms)}
.st b{font-size:18px;letter-spacing:-.02em}.st p{margin:6px 0 0;color:var(--mute);font-size:14px;line-height:1.45}
.st .n{position:absolute;right:18px;top:14px;font-size:44px;font-weight:900;color:var(--soft2)}
.st::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(18,184,134,.07),transparent 70%);animation:shine 5s infinite;animation-delay:calc(var(--d)*900ms)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:46px 0 16px}
.sec-h h2{font-size:clamp(24px,3.5vw,32px);font-weight:800}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:40px calc(-1*clamp(16px,4vw,40px)) 0;padding:12px 0;font-size:13px;color:var(--mute)}
.ticker div{display:inline-block;animation:ticker 45s linear infinite}.ticker span{margin:0 26px}.ticker b{color:var(--ink)}
/* lot cards */
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lot{position:relative;display:flex;flex-direction:column;gap:14px;transition:transform .2s,box-shadow .2s;cursor:pointer}
.lot:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--emline),var(--shadow2)}
.lot .top{display:flex;align-items:center;gap:12px}
.lot .em{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--soft);flex:none}
.lot .nm{font-weight:800;font-size:17px;letter-spacing:-.02em}
.lot .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.kv .v{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.lot .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.envs{display:flex;gap:4px;flex-wrap:wrap;min-height:18px}
.envs i{width:22px;height:16px;border-radius:4px;background:var(--emsoft);box-shadow:inset 0 0 0 1px var(--emline);position:relative;animation:drop .5s both}
.envs i::after{content:"";position:absolute;left:3px;right:3px;top:3px;height:6px;border-left:1px solid var(--emline);border-bottom:1px solid var(--emline);transform:skewY(-20deg) rotate(-45deg) scale(.6);opacity:.9}
.cring{position:relative;width:54px;height:54px;flex:none}
.cring svg{transform:rotate(-90deg)}
.cring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
/* lot page */
.back{display:inline-flex;align-items:center;gap:6px;margin:22px 0 8px;font-weight:600;color:var(--mute);font-size:14px}
.lothead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lothead .em{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.lothead h1{font-size:clamp(28px,4.4vw,42px);font-weight:900}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.slider{margin:18px 0 8px}
.slider .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.slider .big{font-size:34px;font-weight:900;letter-spacing:-.03em}
.slider .unit{font-size:15px;color:var(--mute);font-weight:600;margin-left:6px}
.slider input[type=range]{width:100%;margin:14px 0 6px;-webkit-appearance:none;appearance:none;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--em2) var(--p,30%),var(--soft2) var(--p,30%));outline:none}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line2),0 4px 14px rgba(0,0,0,.18);cursor:grab}
.slider input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px var(--line2),0 4px 14px rgba(0,0,0,.18)}
.steppers{display:flex;gap:6px}
.steppers button{width:34px;height:34px;border-radius:10px;background:var(--soft);font-weight:800}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.sum div{padding:12px 14px;border-radius:14px;background:var(--soft)}
.sum .v{font-size:16px;font-weight:800;margin-top:2px}
.agent{margin-top:16px;padding:16px;border-radius:18px;background:linear-gradient(160deg,var(--bluesoft),#fff 70%);box-shadow:inset 0 0 0 1px #d4e4f5}
.agent .hd{display:flex;align-items:center;gap:10px;font-weight:800}
.agent .bot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow);font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{height:34px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.agent ul{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:13px;line-height:1.55}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.bigring{position:relative;width:200px;height:200px;margin:4px auto 10px}
.bigring svg{transform:rotate(-90deg)}
.bigring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigring .t b{font-size:46px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bigring circle.p{transition:stroke-dashoffset 1s linear}
.envbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:10px}
.env{height:42px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);position:relative;overflow:hidden;animation:drop .6s both}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(160deg,var(--soft2),#fff);clip-path:polygon(0 0,100% 0,50% 100%)}
.env::after{content:"🔒";position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:12px}
.env.me{box-shadow:inset 0 0 0 2px var(--em2),var(--shadow)}
.receipt{padding:16px;border-radius:18px;background:var(--emsoft);box-shadow:inset 0 0 0 1px var(--emline);animation:pop .5s both}
.receipt .hd{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--em)}
.sealanim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(251,251,253,.7);backdrop-filter:blur(8px);animation:up .3s both}
.bigenv{width:220px;height:150px;border-radius:18px;background:#fff;box-shadow:var(--shadow2),inset 0 0 0 1px var(--line);position:relative;animation:seal 1s ease both}
.bigenv .flap{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(160deg,var(--emsoft),#fff);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;animation:flap .6s .25s both;box-shadow:inset 0 0 0 1px var(--emline)}
.bigenv .wax{position:absolute;left:50%;top:52%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1fd59a,#0b8a63);display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 6px 18px rgba(11,138,99,.5);animation:pop .5s .75s both}
/* reveal */
.reveal{display:flex;flex-direction:column;gap:16px}
.pricebadge{text-align:center;padding:26px 18px;border-radius:24px;background:linear-gradient(160deg,var(--emsoft),#fff);box-shadow:inset 0 0 0 1px var(--emline),var(--shadow);animation:pop .7s both}
.pricebadge .big{font-size:clamp(40px,7vw,64px);font-weight:900;letter-spacing:-.045em}
.supplybar{display:flex;height:46px;border-radius:14px;overflow:hidden;background:var(--soft2);margin:12px 0 6px}
.supplybar span{height:100%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;animation:fill 1.1s cubic-bezier(.2,.8,.2,1) both;white-space:nowrap;overflow:hidden;border-right:2px solid #fff}
.bidrow{display:grid;grid-template-columns:minmax(120px,1.1fr) 110px 1.6fr 80px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;animation:up .5s both;animation-delay:calc(var(--d)*110ms + 400ms)}
.bidrow:last-child{border:0}
.bidrow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bidrow.me{background:var(--bluesoft);margin:0 -12px;padding:10px 12px;border-radius:12px;border:0}
.bar{height:12px;border-radius:9px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*110ms + 700ms)}
.cutline{display:flex;align-items:center;gap:10px;margin:2px 0;font-size:12px;font-weight:800;color:var(--amber)}
.cutline::before,.cutline::after{content:"";flex:1;border-top:2px dashed #f0c88f}
.yourres{display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;animation:pop .6s .3s both}
.yourres.win{background:var(--emsoft);box-shadow:inset 0 0 0 1px var(--emline)}.yourres.lose{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.yourres .ic{font-size:40px}
.yourres .t{font-size:22px;font-weight:900;letter-spacing:-.02em}
.proof .chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.proof .chk:last-child{border:0}
.proof .chk .o{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:12px;flex:none}
.proof .chk.ok .o{background:var(--em2);color:#fff;animation:pop .4s both}
.shuffle{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.shuffle span{padding:6px 10px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:700;animation:pop .35s both;animation-delay:calc(var(--d)*60ms)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(29,29,31,.28);backdrop-filter:blur(10px);animation:up .25s both}
.sheet{width:min(440px,100%);background:#fff;border-radius:28px;padding:26px;box-shadow:var(--shadow2);text-align:center;animation:pop .4s both}
.phone{width:92px;height:92px;margin:4px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:var(--emsoft);position:relative}
.phone.ringing span{animation:ring 1s infinite;display:inline-block}
.phone.ringing::before,.phone.ringing::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--em2);animation:wave 1.6s infinite}
.phone.ringing::after{animation-delay:.8s}
.field{display:flex;align-items:center;gap:8px;height:56px;border-radius:16px;padding:0 16px;background:var(--soft);margin:12px 0;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.field:focus-within{box-shadow:inset 0 0 0 1px var(--em2),0 0 0 5px rgba(18,184,134,.12);background:#fff}
.field input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:19px;font-weight:700;min-width:0}
.field .pre{font-weight:800;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;padding:12px 18px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow2);animation:up .3s both;max-width:90vw}
.confetti{position:fixed;z-index:80;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:confetti 1.6s cubic-bezier(.1,.7,.3,1) forwards}


/* ---------- easy buy ---------- */
.easy{max-width:520px;margin:0 auto;padding:18px 0 40px}
.ehead{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:10px}
.eback{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);font-size:18px}
.edots{display:flex;gap:6px}.edots i{width:28px;height:6px;border-radius:9px;background:var(--soft2);transition:.3s}.edots i.on{background:linear-gradient(90deg,#12b886,#0b8a63)}
.etitle{font-size:clamp(30px,6vw,40px);font-weight:900;letter-spacing:-.04em;text-align:center;margin:8px 0 6px}
.esub{text-align:center;color:var(--mute);margin:0 0 22px}
.egrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.etile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;border-radius:22px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);text-align:left;transition:transform .15s,box-shadow .15s}
.etile:hover,.etile:active{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--em2),var(--shadow2)}
.etile .ei{font-size:34px}.etile b{font-size:17px;letter-spacing:-.02em}.etile small{color:var(--mute);font-weight:600}
.eamount{display:flex;align-items:center;justify-content:center;gap:26px;margin:26px 0 18px;text-align:center}
.eround{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);font-size:30px;font-weight:700}
.eround:active{transform:scale(.94)}
.ebig{font-size:76px;font-weight:900;letter-spacing:-.05em;line-height:1}
.eunit{color:var(--mute);font-weight:700;margin-top:4px}
.echips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.echips button{height:42px;padding:0 18px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-weight:800}
.echips button.on{background:var(--ink);color:#fff;box-shadow:none}
.ebtn{width:100%;height:60px;font-size:18px;border-radius:20px;margin-top:26px}
.eopts{display:flex;flex-direction:column;gap:10px}
.eopt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),var(--shadow);transition:.15s}
.eopt .ei{font-size:30px}.eopt b{display:block;font-size:17px}.eopt small{display:block;color:var(--mute);font-size:13px}
