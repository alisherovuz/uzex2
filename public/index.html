<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Aniq — adolatli birja savdosi</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--s:#fff;--s2:#f9fafb;--b:#e4e7ec;--b2:#d0d5dd;--t:#101828;--t2:#344054;--m:#667085;--f:#98a2b3;
--a:#0b8a63;--a2:#12b886;--as:#ecfdf3;--al:#abefc6;--r:#d92d20;--rs:#fef3f2;--y:#b54708;--ys:#fffaeb;--u:#175cd3;--us:#eff8ff;
--sh:0 1px 2px rgba(16,24,40,.05);--sh2:0 12px 32px -8px rgba(16,24,40,.14);--rad:12px;
--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--m)}.tiny{font-size:12px;color:var(--m)}
.up{color:var(--a)}.dn{color:var(--r)}.fl{color:var(--m)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.in{animation:fade .35s ease both;animation-delay:calc(var(--d,0)*40ms)}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--b)}
.navi{max-width:1200px;margin:0 auto;height:60px;display:flex;align-items:center;gap:24px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:28px;height:28px}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}.brand span{display:block;font-size:11px;color:var(--m);font-weight:500;margin-top:-2px}
.tabs{display:flex;gap:2px;height:100%}
.tabs a{display:flex;align-items:center;padding:0 12px;font-weight:600;color:var(--m);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--t);border-color:var(--a)}
.sp{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--t2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--a2);animation:pulse 1.6s infinite}
.bal{font-size:13px;font-weight:600;color:var(--t2);padding:7px 12px;border:1px solid var(--b);border-radius:10px;background:#fff}
.bal b{color:var(--t)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;background:var(--a);color:#fff;box-shadow:var(--sh);transition:background .15s,transform .1s}
.btn:hover{background:#087553}.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--t2);box-shadow:inset 0 0 0 1px var(--b2),var(--sh)}.btn.sec:hover{background:var(--s2)}
.btn.dark{background:var(--t)}.btn.dark:hover{background:#1d2939}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.lg{height:48px;font-size:15px;border-radius:12px}
.btn.icon{width:40px;padding:0}
.btn:disabled{opacity:.45;pointer-events:none}
/* layout */
main{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
.card{background:#fff;border:1px solid var(--b);border-radius:var(--rad);box-shadow:var(--sh)}
.pad{padding:18px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.ph .sub{color:var(--m);margin-top:4px}
.lbl{font-size:12px;font-weight:600;color:var(--m);margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--s2);color:var(--t2);border:1px solid var(--b);white-space:nowrap}
.chip.g{background:var(--as);color:var(--a);border-color:var(--al)}.chip.r{background:var(--rs);color:var(--r);border-color:#fecdca}.chip.y{background:var(--ys);color:var(--y);border-color:#fedf89}.chip.u{background:var(--us);color:var(--u);border-color:#b2ddff}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.badge{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--a);background:var(--as);border:1px solid var(--al);flex:none}
.badge.lg{width:48px;height:48px;font-size:15px;border-radius:12px}
/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.kpis>div{padding:16px 18px;border-right:1px solid var(--b)}.kpis>div:last-child{border:0}
.kpis .k{font-size:12px;color:var(--m);font-weight:500}.kpis .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px}.kpis .s{font-size:12px;color:var(--f)}
/* segmented + search */
.seg{display:inline-flex;padding:3px;border-radius:10px;background:#fff;border:1px solid var(--b);gap:2px;flex-wrap:wrap}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--m)}
.seg button.on{background:var(--t);color:#fff}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;background:#fff;border:1px solid var(--b);min-width:240px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:13px}
.search svg{flex:none;color:var(--f)}
/* table */
.tbl{overflow:hidden}
.tr{display:grid;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--b)}
.tr:last-child{border-bottom:0}
.tr.h{padding:10px 18px;background:var(--s2);font-size:12px;font-weight:600;color:var(--m)}
.tr.click{cursor:pointer;transition:background .12s}.tr.click:hover{background:#fafdfb}
.lots .tr{grid-template-columns:2.2fr 1.6fr .7fr 1fr 1.1fr 100px .7fr .7fr 84px}
.res .tr{grid-template-columns:1.1fr 2fr 1.1fr .9fr .9fr .8fr}
.my .tr{grid-template-columns:.8fr 2fr 1fr 1fr 1fr 1fr}
.alloc .tr{grid-template-columns:2fr 1.1fr .9fr .9fr 1fr}
.r{text-align:right}.c{text-align:center}
.prod{display:flex;align-items:center;gap:12px;min-width:0}
.prod b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod small{display:block;color:var(--m);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnum{font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:36px;text-align:center;color:var(--m)}
.foot{margin-top:14px;font-size:12px;color:var(--f);display:flex;gap:8px;align-items:center}
/* lot page */
.crumb{font-size:13px;color:var(--m);margin-bottom:14px}.crumb a:hover{color:var(--t)}
.lh{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.lh h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.lh .timer{margin-left:auto;text-align:right}
.lh .timer b{display:block;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.g2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.terms{display:grid;grid-template-columns:repeat(4,1fr)}
.terms>div{padding:12px 16px;border-right:1px solid var(--b);border-bottom:1px solid var(--b)}
.terms>div:nth-child(4n){border-right:0}.terms>div:nth-last-child(-n+4){border-bottom:0}
.terms .k{font-size:12px;color:var(--m)}.terms .v{font-weight:600;margin-top:2px}
.chart .ln{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.2s ease forwards}
.ticket .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{display:flex;align-items:center;height:44px;border:1px solid var(--b2);border-radius:10px;background:#fff;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.field:focus-within{border-color:var(--a);box-shadow:0 0 0 4px rgba(11,138,99,.12)}
.field input{flex:1;min-width:0;border:0;outline:0;padding:0 12px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;background:transparent}
.field .u{padding:0 12px;color:var(--m);font-size:13px}
.field button{width:40px;height:100%;border-left:1px solid var(--b);font-size:18px;color:var(--t2)}.field button:hover{background:var(--s2)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.presets button{padding:9px 10px;border-radius:10px;border:1px solid var(--b);background:#fff;text-align:left}
.presets button b{display:block;font-size:13px}.presets button span{font-size:12px;color:var(--m);font-variant-numeric:tabular-nums}
.presets button.on{border-color:var(--a);background:var(--as)}
.sum div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--b);font-size:13px}
.sum div:last-child{border:0}.sum span{color:var(--m)}.sum b{font-variant-numeric:tabular-nums}
.note{padding:10px 12px;border-radius:10px;font-size:12px;background:var(--s2);border:1px solid var(--b);color:var(--t2)}
.note.g{background:var(--as);border-color:var(--al);color:#05603a}.note.r{background:var(--rs);border-color:#fecdca;color:#912018}
.sealed{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.sealed i{width:18px;height:14px;border-radius:3px;background:var(--s2);border:1px solid var(--b2);animation:fade .3s both}
.sealed i.me{background:var(--as);border-color:var(--a)}
.bigprice{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:9px;background:#f2f4f7;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transform-origin:left;animation:grow .8s ease both}
.cut{padding:6px 18px;background:var(--ys);color:var(--y);font-size:12px;font-weight:600;border-bottom:1px solid #fedf89}
.me-row{background:var(--us)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.chk span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--a);color:#fff;flex:none}
.chk.no span{background:var(--r)}
/* easy */
.easy{max-width:480px;margin:8px auto 0}
.ehead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.steps{display:flex;gap:6px;flex:1}.steps i{flex:1;height:4px;border-radius:9px;background:var(--b)}.steps i.on{background:var(--a)}
.etitle{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.elist .tr{grid-template-columns:1fr auto;padding:14px 16px}
.eqty{display:flex;align-items:center;justify-content:center;gap:20px;padding:26px 0 18px}
.eqty .n{font-size:54px;font-weight:700;letter-spacing:-.03em;min-width:140px;text-align:center;font-variant-numeric:tabular-nums}
.eqty button{width:52px;height:52px;border-radius:50%;border:1px solid var(--b2);background:#fff;font-size:24px;box-shadow:var(--sh)}
.qchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.qchips button{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--b);background:#fff;font-weight:600}
.qchips button.on{background:var(--t);color:#fff;border-color:var(--t)}
.eopt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--b);border-radius:12px;background:#fff;text-align:left;margin-bottom:8px}
.eopt .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--b2);flex:none}
.eopt.on{border-color:var(--a);background:var(--as)}.eopt.on .rad{border:5px solid var(--a)}
.eopt b{display:block}.eopt small{color:var(--m)}
.hold{position:relative;overflow:hidden;width:100%;height:52px;border-radius:12px;background:var(--t);color:#fff;font-weight:600;font-size:15px;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fb{position:absolute;inset:0 auto 0 0;width:0;background:var(--a)}.hold span{position:relative}
.okmark{width:64px;height:64px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;background:var(--as);border:1px solid var(--al);color:var(--a);font-size:28px;font-weight:800}
.okmark.no{background:var(--s2);border-color:var(--b);color:var(--m)}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(16,24,40,.45);animation:fade .2s both}
.sheet{width:min(420px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:var(--sh2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;padding:11px 16px;border-radius:10px;background:var(--t);color:#fff;font-weight:500;font-size:13px;box-shadow:var(--sh2);animation:fade .2s both;max-width:90vw}
.ring{position:relative;width:40px;height:40px}.ring svg{transform:rotate(-90deg)}
.bottomnav{display:none}
@media(max-width:980px){
 .navi{gap:12px;padding:0 14px}.tabs,.status,.hide-m{display:none!important}
 .kpis{grid-template-columns:1fr 1fr}.kpis>div:nth-child(2){border-right:0}.kpis>div:nth-child(-n+2){border-bottom:1px solid var(--b)}
 .g2{grid-template-columns:1fr}.terms{grid-template-columns:1fr 1fr}.terms>div{border-right:1px solid var(--b)!important;border-bottom:1px solid var(--b)!important}
 .tr.h{display:none}.lots .tr,.res .tr,.my .tr,.alloc .tr{grid-template-columns:1fr auto;gap:4px 12px}
 .search{min-width:0;flex:1}
 main{padding-bottom:96px}
 .bottomnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--b);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
 .bottomnav a{text-align:center;font-size:12px;font-weight:600;color:var(--m)}.bottomnav a.on{color:var(--a)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="nav"><div class="navi">
  <a class="brand" href="#/"><img src="/logo.svg" alt=""><div><b>Aniq</b><span>Adolatli birja savdosi</span></div></a>
  <nav class="tabs"><a href="#/" data-t="home">Savdo</a><a href="#/results" data-t="results">Natijalar</a><a href="#/me" data-t="me">Kabinet</a></nav>
  <div class="sp"></div>
  <div class="status"><i></i><span id="clock">—</span></div>
  <button class="btn sec icon" id="navcall" title="AI agent qo'ng'iroq qiladi" aria-label="Qo'ng'iroq"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
  <a class="btn" href="#/buy" id="navbuy">Xarid qilish</a>
  <a class="bal hide-m" href="#/me">Hisob: <b id="wbal">—</b></a>
</div></header>
<main id="app"></main>
<nav class="bottomnav"><a href="#/" data-t="home">Savdo</a><a href="#/buy" data-t="buy">Xarid</a><a href="#/results" data-t="results">Natijalar</a><a href="#/me" data-t="me">Kabinet</a></nav>
<script type="module" src="/app.js"></script>
</body>
</html>
